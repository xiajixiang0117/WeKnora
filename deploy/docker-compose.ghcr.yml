# CI-managed overlay for a deployment that consumes GHCR images.
#
# The deployment workflow copies this file to <DEPLOY_PATH>/.ci/ and layers it
# after the site's docker-compose.yml and docker-compose.override.yml.  It
# deliberately changes only the three application image references: all
# service settings, .env values, volumes, and dependent services remain owned
# by the server's existing Compose files.
services:
  frontend:
    image: ghcr.io/${WEKNORA_IMAGE_OWNER}/weknora-ui:${WEKNORA_IMAGE_TAG}
  app:
    image: ghcr.io/${WEKNORA_IMAGE_OWNER}/weknora-app:${WEKNORA_IMAGE_TAG}
  docreader:
    image: ghcr.io/${WEKNORA_IMAGE_OWNER}/weknora-docreader:${WEKNORA_IMAGE_TAG}

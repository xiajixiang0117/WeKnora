name: App

# Anydoc (Rust archive + `anydoc` build tag) lives in anydoc.yml so its
# expensive Rust build can be dispatched separately.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  LOG_FORMAT: ""

jobs:
  verify:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # v6 defaults to go.mod for the cache key (more stable than go.sum).

      - name: Download modules
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          base=$(git rev-parse HEAD^)
          diff_range="$base..$GITHUB_SHA"
          unformatted=$(
            git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.go' ':!cli/**' |
              xargs -0 -r gofmt -l
          )
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet and test
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/docreader/')
          go vet "${pkgs[@]}"
          go test "${pkgs[@]}"

      - name: Build server
        run: go build ./cmd/server

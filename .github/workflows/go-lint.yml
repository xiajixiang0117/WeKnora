name: Go Lint

# Manually lint all Go modules. Manual runs have no pull-request diff, so this
# workflow reports the full set of findings instead of filtering to new issues.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOPROXY: https://proxy.golang.org,direct

jobs:
  # A manual run has no PR diff to narrow the scope, so lint every Go module.
  changes:
    name: detect lint modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select modules
        id: detect
        shell: bash
        run: |
          modules='[".","cli","client"]'
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"
          echo "Lint modules: ${modules}"

  golangci:
    name: golangci-lint (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          only-new-issues: false

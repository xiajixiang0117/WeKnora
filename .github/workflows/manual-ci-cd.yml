name: Manual CI/CD to Shared Server

# This is the standard release entry point: it validates main, publishes the
# ACR images produced from that same ref, then deploys their main tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-weknora-ci-cd-main
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: Validate release ref
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || {
            echo "Manual CI/CD deployments must run from the main branch; got $REF." >&2
            exit 1
          }

  verify-app:
    name: Verify app
    needs: validate-release-ref
    uses: ./.github/workflows/app.yml

  verify-frontend:
    name: Verify frontend
    needs: validate-release-ref
    uses: ./.github/workflows/frontend.yml

  verify-docreader:
    name: Verify DocReader
    needs: validate-release-ref
    uses: ./.github/workflows/docreader.yml

  build-images:
    name: Build and publish ACR images
    needs:
      - verify-app
      - verify-frontend
      - verify-docreader
    uses: ./.github/workflows/docker-image.yml
    with:
      registry: acr
    secrets: inherit

  deploy:
    name: Deploy main images to shared server
    needs: build-images
    uses: ./.github/workflows/manual-registry-deploy.yml
    with:
      version: main
    secrets: inherit
